
name: Build and Publish Orders Service

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript
        run: node --check index.js

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA} .

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push'
        run: |
          docker push \
            ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}

